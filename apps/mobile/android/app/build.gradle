plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// White-label: applicationId and app label are injected per-tenant at build time.
// On CI: set_tenant_branding.sh exports the APP_NAME env var before the build.
// Locally: flutter run/build forwards --dart-define-from-file entries to Gradle
// as the "dart-defines" project property (comma-separated, each entry
// base64("KEY=value") — see Flutter's encodeDartDefines), so the same
// .env/<tenant>.<environment>.json used by the Dart layer also drives the
// native app label here, with no separate local setup needed.
def dartDefines = [:]
if (project.hasProperty("dart-defines")) {
    project.property("dart-defines").toString().split(",").each { encoded ->
        def decoded = new String(encoded.decodeBase64(), "UTF-8")
        def i = decoded.indexOf("=")
        if (i > 0) {
            dartDefines[decoded.substring(0, i)] = decoded.substring(i + 1)
        }
    }
}

def tenantPackageName = System.getenv("PACKAGE_NAME") ?: "com.businessassistant.demo"
def tenantAppName = System.getenv("APP_NAME") ?: dartDefines["APP_NAME"] ?: "Business Assistant"

// Read key.properties for local release signing (not used on CI).
// Create android/key.properties with your local keystore path if you want to
// test release builds locally. This file is gitignored.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // namespace must match the package declared in AndroidManifest.xml and MainActivity.kt.
    // This does NOT change with the tenant — it identifies the code, not the store listing.
    namespace = "com.businessassistant.business_assistant"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // flutter_local_notifications requires Java 8+ APIs via desugaring
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // applicationId is the Play Store identifier — changes per tenant
        applicationId = tenantPackageName
        // Inject the tenant app name into AndroidManifest.xml android:label placeholder
        manifestPlaceholders += [appName: tenantAppName]
        // flutter_secure_storage requires minSdk 23 (Android 6.0)
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (System.getenv()["GITHUB_ACTIONS"]) {
                // On GitHub Actions, secrets are exported as environment variables
                // by the mobile-android.yml workflow before the build step.
                storeFile file(System.getenv()["ANDROID_KEYSTORE_PATH"])
                storePassword System.getenv()["ANDROID_KEYSTORE_PASSWORD"]
                keyAlias System.getenv()["ANDROID_KEY_ALIAS"]
                keyPassword System.getenv()["ANDROID_KEY_PASSWORD"]
            } else {
                // Local release signing — requires android/key.properties
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
