name: business_assistant
description: "Business Operations Platform — white-label multi-tenant mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client — used for all API calls (Identity, future microservices)
  dio: ^5.8.0+1

  # State management — Cubit pattern (simpler than full Bloc for most screens)
  flutter_bloc: ^8.1.6

  # Value-equality for Cubit states (copyWith-style state classes)
  equatable: ^2.1.0

  # Navigation — declarative routing with auth redirect support
  go_router: ^14.6.2

  # Secure token storage — JWT access token + refresh token stored in Keystore/Keychain
  flutter_secure_storage: ^9.2.4

  # JWT payload parsing — reads exp, sub, role, tenantId claims without a server round-trip
  jwt_decode: ^0.3.1

  # In-app toast notifications — success / error / warning / info
  toastification: ^2.3.0

  # SVG image rendering — tenant logos are SVG files stored in assets/tenants/
  flutter_svg: ^2.0.16

  # Network image loading with disk caching — used by LoadedImage (avatars, etc.)
  cached_network_image: ^3.4.1

  skeletonizer: ^2.1.3

  # Localizations (ARB-based) — English and Serbian supported
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Combined date + time wheel picker — used by DateInputField when includeTime is set
  flutter_datetime_picker_plus: ^2.4.0

  # Opens external apps/browser — used to open a selected event location in Google Maps
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting — flutter_lints ruleset + our overrides in analysis_options.yaml
  flutter_lints: ^4.0.0

  # Generates launcher icons for Android (and iOS when we add it)
  flutter_launcher_icons: ^0.14.3

  # Generates the native splash screen from a PNG asset
  flutter_native_splash: ^2.4.4

flutter:
  # Required for ARB code generation (l10n)
  generate: true

  uses-material-design: true

  assets:
    # SVG vector assets (shared across tenants)
    - assets/svg/
    # Language flag icons, used by LanguageSwitcher
    - assets/svg/flags/
    # GIF assets (e.g. the shared button loading spinner)
    - assets/gifs/
    # Demo tenant assets: logo.svg, app_icon.png, splash_logo.png
    - assets/tenants/demo/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
