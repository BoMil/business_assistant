name: Mobile — Android Build

# Triggers:
#   - Push to main or develop that touches apps/mobile/** code
#   - Manual trigger (workflow_dispatch) so you can build any tenant on demand
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  build-android:
    name: Build Android (${{ matrix.tenant }})
    runs-on: ubuntu-latest

    # Matrix strategy: one job per tenant.
    # Add more tenants here as the platform grows (e.g. "acme", "beta").
    strategy:
      matrix:
        tenant: [demo]

    # All steps run from the apps/mobile directory (monorepo layout)
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 (required by Gradle 8.x) ──────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Set up Flutter via FVM config ────────────────────────────────────
      # subosito/flutter-action reads .fvmrc to pin the correct Flutter version.
      - name: Set up Flutter (FVM)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/mobile/.fvmrc
          cache: true

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 5. Static analysis ───────────────────────────────────────────────────
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # ── 6. Decode and write the Android keystore from the GitHub secret ──────
      # The keystore is stored as a base64-encoded secret in GitHub Actions.
      # To generate it: base64 -i your.keystore | pbcopy  → paste into secret.
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/apps/mobile/keystore.jks" >> $GITHUB_ENV

      # ── 7. Apply tenant branding (icons, splash, env JSON) ───────────────────
      - name: Apply tenant branding
        env:
          TENANT_ID: ${{ matrix.tenant }}
          APP_NAME: Business Assistant
          PACKAGE_NAME: com.businessassistant.${{ matrix.tenant }}
        run: bash scripts/set_tenant_branding.sh

      # ── 8. Build release APK ─────────────────────────────────────────────────
      # The .env JSON is selected based on the triggering event:
      #   - workflow_dispatch: uses the chosen environment input
      #   - push to develop: staging
      #   - push to main: production
      - name: Determine environment
        id: env_name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=production" >> $GITHUB_OUTPUT
          else
            echo "name=staging" >> $GITHUB_OUTPUT
          fi

      # ── 8.5. Fetch tenant config from backend (optional) ─────────────────────
      # Once a real Identity API is deployed, set TENANT_CONFIG_API_URL and
      # TENANT_CONFIG_API_KEY as repo secrets to pull fresh branding + feature
      # flags from the tenant's database row and merge them into the local
      # .env file before building. Until then (no secret configured) this step
      # is a no-op — the checked-in .env file is used as-is, same as today.
      - name: Fetch tenant config from backend (optional)
        env:
          TENANT_CONFIG_API_URL: ${{ secrets.TENANT_CONFIG_API_URL }}
          TENANT_CONFIG_API_KEY: ${{ secrets.TENANT_CONFIG_API_KEY }}
        run: |
          ENV_FILE=".env/${{ matrix.tenant }}.${{ steps.env_name.outputs.name }}.json"

          if [ -z "$TENANT_CONFIG_API_URL" ]; then
            echo "TENANT_CONFIG_API_URL not set — using local $ENV_FILE as-is."
            exit 0
          fi

          echo "Fetching tenant config for '${{ matrix.tenant }}' from $TENANT_CONFIG_API_URL"
          curl -sf -H "X-Api-Key: $TENANT_CONFIG_API_KEY" \
            "$TENANT_CONFIG_API_URL/tenants/${{ matrix.tenant }}/config" -o tenant-config.json

          # Backend returns hex colors like "#1A237E" — mobile expects ARGB "FF1A237E".
          # featureFlags.* -> FEATURE_* (uppercase), name -> APP_NAME.
          jq '{
            APP_NAME: .name,
            PRIMARY_COLOR: ("FF" + (.primaryColor | ltrimstr("#") | ascii_upcase)),
            ACCENT_COLOR: ("FF" + (.accentColor | ltrimstr("#") | ascii_upcase)),
            ERROR_COLOR: ("FF" + (.errorColor | ltrimstr("#") | ascii_upcase)),
            FEATURE_RENTAL: (.featureFlags.rental | tostring),
            FEATURE_INVENTORY: (.featureFlags.inventory | tostring),
            FEATURE_REPORTING: (.featureFlags.reporting | tostring),
            FEATURE_POULTRY: (.featureFlags.poultry | tostring),
            FEATURE_THEME_CHANGE: (.featureFlags.themeChange | tostring),
            FEATURE_LANGUAGE: (.featureFlags.language | tostring)
          }' tenant-config.json > tenant-config.mapped.json

          # Merge fetched values over the local file — SERVER_ADDRESS/ENVIRONMENT/
          # PACKAGE_NAME/TENANT_ID aren't part of the fetched JSON, so they're kept as-is.
          jq -s '.[0] * .[1]' "$ENV_FILE" tenant-config.mapped.json > "$ENV_FILE.merged"
          mv "$ENV_FILE.merged" "$ENV_FILE"

          echo "Merged tenant config into $ENV_FILE"

      - name: Build release APK
        env:
          PACKAGE_NAME: com.businessassistant.${{ matrix.tenant }}
          APP_NAME: Business Assistant
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_ACTIONS: true
        run: |
          flutter build apk --release \
            --dart-define-from-file=.env/${{ matrix.tenant }}.${{ steps.env_name.outputs.name }}.json

      # ── 9. Upload APK as a workflow artifact ─────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tenant }}-${{ steps.env_name.outputs.name }}-release.apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
