# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.override.yml — development konfiguracija
#
# Docker Compose automatski merguje ovaj fajl sa docker-compose.yml.
# Ovde idu: portovi, environment varijable, development-only podesavanja.
#
# Cross-platform napomena (Mac vs Windows):
#   - Na Mac-u: ne trebaju User Secrets volumes jer koristimo env vars
#   - Na Windows-u: isti fajl radi isto
#   - Nema HTTPS u Docker dev okruzenju — terminirajte TLS na reverse proxy-ju
#
# Environment varijable sa __ (double underscore) mapiraju se na nested config:
#   ConnectionStrings__IdentityDb  →  ConnectionStrings:IdentityDb u appsettings
#   Jwt__Secret                    →  Jwt:Secret u appsettings
# ─────────────────────────────────────────────────────────────────────────────

services:

  identity.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # HTTP only u Docker dev-u — nema certifikata, nema HTTPS komplikacija
      - ASPNETCORE_URLS=http://+:8080
      # Connection string koristi ime containera "ba-db" kao server
      # (Docker interni DNS razresava ime servisa unutar backend mreze)
      - ConnectionStrings__IdentityDb=Server=ba-db;Database=IdentityDb;User=SA;Password=Password@12345#;TrustServerCertificate=True
      # JWT podesavanja — overriduju appsettings.json vrednosti
      # Secret ovde je za development only — u produkciji dolazi iz Azure Key Vault
      - Jwt__Secret=dev-super-secret-key-minimum-32-characters-long-for-hmacsha256
      - Jwt__Issuer=identity-api
      - Jwt__Audience=business-assistant-clients
      - Jwt__ExpiryMinutes=60
      # Deljeni kljuc za GET /tenants/{slug}/config — koristi ga CI/CD pipeline, dev only
      - CiApiKey=dev-ci-api-key-change-me
    ports:
      # host_port:container_port
      # Identity API dostupan na: http://localhost:5100
      # Swagger UI: http://localhost:5100/swagger
      - "5100:8080"

  business.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__BusinessDb=Server=ba-db;Database=BusinessDb;User=SA;Password=Password@12345#;TrustServerCertificate=True
      # Jwt vrednosti moraju biti IDENTICNE Identity servisu — Business samo validira
      # tokene koje je Identity izdao, ne izdaje sopstvene (vidi Business.Infrastructure).
      - Jwt__Secret=dev-super-secret-key-minimum-32-characters-long-for-hmacsha256
      - Jwt__Issuer=identity-api
      - Jwt__Audience=business-assistant-clients
      # Pravi Azure Storage connection string (real cloud credential — ne sme u appsettings/git).
      # Ucitava se iz lokalnog .env fajla (gitignored) — vidi .env.example.
      - BlobStorage__ConnectionString=${BLOB_STORAGE_CONNECTION_STRING}
    ports:
      # Business API dostupan na: http://localhost:5101
      # Swagger UI: http://localhost:5101/swagger
      - "5101:8080"

  gateway.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Container-network adrese (Docker DNS razresava ime servisa) — YARP destinacije.
      - ReverseProxy__Clusters__identityCluster__Destinations__destination1__Address=http://identity.api:8080
      - ReverseProxy__Clusters__businessCluster__Destinations__destination1__Address=http://business.api:8080
    ports:
      # Gateway dostupan na: http://localhost:5099 — JEDINA adresa koju mobilna aplikacija zna
      # (port 5000 je na Mac-u obicno zauzet od strane AirPlay Receiver-a / ControlCenter-a)
      - "5099:8080"

  ba-db:
    ports:
      # SQL Server dostupan na host masini za direktno spajanje iz IDE-a ili SSMS
      # Connection string za lokalni pristup: Server=localhost,1433;User=SA;Password=Password@12345#;TrustServerCertificate=True
      - "1433:1433"
